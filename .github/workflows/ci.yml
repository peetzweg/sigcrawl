name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module cache
        run: go mod verify

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          changed="$(gofmt -l .)"
          if [ -n "$changed" ]; then
            printf 'gofmt wants changes in:\n%s\n' "$changed"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build CLI
        run: go build -ldflags "-X github.com/peetzweg/sigcrawl/internal/cli.version=ci" -o bin/sigcrawl ./cmd/sigcrawl

      - name: Smoke test CLI control surface
        run: |
          set -euo pipefail
          help_output="$(./bin/sigcrawl --help 2>&1 || true)"
          printf '%s\n' "$help_output"
          printf '%s' "$help_output" | grep -q "sigcrawl: Signal Desktop archive crawler"
          printf '%s' "$help_output" | grep -q "doctor"
          printf '%s' "$help_output" | grep -q "sync"
          printf '%s' "$help_output" | grep -q "search"
          test "$(./bin/sigcrawl version)" = "ci"
          ./bin/sigcrawl --json metadata | grep -q '"schema_version"'
          # doctor must run cleanly even with no Signal Desktop install on the CI runner.
          ./bin/sigcrawl --json doctor | grep -q '"store"'
