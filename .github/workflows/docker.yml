name: docker

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t sigcrawl:ci .

      - name: Smoke test image
        run: |
          set -euo pipefail
          help_output="$(docker run --rm sigcrawl:ci --help 2>&1 || true)"
          printf '%s\n' "$help_output"
          printf '%s' "$help_output" | grep -q "sigcrawl: Signal Desktop archive crawler"
          # sigcrawl bundles git (for backup) and sigtop (for SQLCipher decryption).
          docker run --rm --entrypoint git sigcrawl:ci --version
          # sigtop binary must exist and be executable. Don't try to invoke it
          # — its behaviour in the slim image depends on libsecret availability
          # and that's covered by the build itself: if the binary can't be
          # produced, the Docker build fails at the sigtop-build stage.
          docker run --rm --entrypoint test sigcrawl:ci -x /usr/local/bin/sigtop
          docker run --rm sigcrawl:ci --json doctor | grep -q '"store"'
